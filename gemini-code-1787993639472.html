<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Agent Runner - Realistic Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            box-shadow: 0 16px 50px rgba(0,0,0,0.9);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }
        canvas {
            display: block;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 12, 18, 0.88);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f1c40f;
            text-shadow: 0 4px 12px rgba(0,0,0,0.7);
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 24px;
            color: #cbd5e1;
        }
        .controls-hint {
            background: rgba(255,255,255,0.08);
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        button {
            padding: 14px 34px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(241, 196, 15, 0.4);
            transition: all 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(241, 196, 15, 0.6);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            z-index: 5;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 20px;
            display: flex;
            gap: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Distance: <span id="dist">0</span>m</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>Realistic Agent Runner</h1>
        <div class="controls-hint">
            Move: <b>A / D</b> or <b>← / →</b> | Jump: <b>Space</b> / <b>W</b> (Hold for higher jump)
        </div>
        <p>Master inertia, cross deep chasms & squish bugs safely!</p>
        <button id="start-btn">Start Game</button>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen hidden">
        <h1>Fell Into The Abyss!</h1>
        <p>Final Score: <span id="final-score">0</span> | Distance: <span id="final-dist">0</span>m</p>
        <button id="restart-btn">Try Again</button>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const scoreEl = document.getElementById('score');
const distEl = document.getElementById('dist');
const finalScoreEl = document.getElementById('final-score');
const finalDistEl = document.getElementById('final-dist');

let gameState = 'START';
let score = 0;
let distance = 0;
let cameraX = 0;
let cameraY = 0;
let screenShake = 0;
let lastGeneratedX = 0;
let lastGeneratedY = 340;

// Web Audio Synthesizer
let audioCtx;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playJumpSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(380, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
}

function playCoinSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(987, now);
    osc.frequency.setValueAtTime(1318, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
}

function playSquishSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(240, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.14);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.14);
}

function playChestSound() {
    if (!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const start = audioCtx.currentTime + idx * 0.06;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.15, start);
        gain.gain.exponentialRampToValueAtTime(0.01, start + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.18);
    });
}

function playGameOverSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.7);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.7);
}

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Particle System
class Particle {
    constructor(x, y, vx, vy, color, size, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.life = life;
        this.maxLife = life;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // Gravity on particles
        this.life--;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - cameraX, this.y - cameraY, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

let particles = [];

function spawnParticles(x, y, color, count = 10, speedMultiplier = 1) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = (Math.random() * 3 + 1) * speedMultiplier;
        particles.push(new Particle(
            x, y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed - 1,
            color,
            Math.random() * 3 + 2,
            Math.floor(Math.random() * 20 + 20)
        ));
    }
}

// Physics Constants
const GRAVITY = 0.55;
const ACCELERATION = 0.7;
const FRICTION = 0.82;
const AIR_RESISTANCE = 0.94;
const MAX_SPEED = 5.2;
const JUMP_FORCE = -11.5;

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 22;
        this.height = 46;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = false;
        this.facingRight = true;
        this.squash = 0;
        this.runCycle = 0;
    }

    update(platforms) {
        // Accelerate horizontally with inertia
        if (keys['KeyD'] || keys['ArrowRight']) {
            this.vx += ACCELERATION;
            this.facingRight = true;
        } else if (keys['KeyA'] || keys['ArrowLeft']) {
            this.vx -= ACCELERATION;
            this.facingRight = false;
        } else {
            this.vx *= this.isGrounded ? FRICTION : AIR_RESISTANCE;
        }

        // Clamp Speed
        if (this.vx > MAX_SPEED) this.vx = MAX_SPEED;
        if (this.vx < -MAX_SPEED) this.vx = -MAX_SPEED;

        // Variable Jump Height
        if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && this.isGrounded) {
            this.vy = JUMP_FORCE;
            this.isGrounded = false;
            this.squash = 0.8;
            playJumpSound();
            spawnParticles(this.x + this.width / 2, this.y + this.height, '#e2e8f0', 6);
        }

        // Cut jump short if button released early
        if (!(keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && this.vy < -4) {
            this.vy *= 0.5;
        }

        this.vy += GRAVITY;
        if (this.vy > 14) this.vy = 14; // Terminal velocity

        // Horizontal Movement & Collisions
        this.x += this.vx;
        this.checkHorizontalCollisions(platforms);

        // Vertical Movement & Collisions
        this.y += this.vy;
        let wasGrounded = this.isGrounded;
        this.isGrounded = false;
        this.checkVerticalCollisions(platforms);

        // Hard landing screen shake & particles
        if (!wasGrounded && this.isGrounded && this.vy > 8) {
            screenShake = 4;
            spawnParticles(this.x + this.width / 2, this.y + this.height, '#94a3b8', 8);
        }

        // Update gait cycle
        if (this.isGrounded && Math.abs(this.vx) > 0.5) {
            this.runCycle += Math.abs(this.vx) * 0.15;
        }

        if (this.squash > 0) this.squash -= 0.08;

        // Fall into abyss check
        if (this.y > 600) {
            triggerGameOver();
        }
    }

    checkHorizontalCollisions(platforms) {
        for (let p of platforms) {
            if (this.x < p.x + p.w && this.x + this.width > p.x &&
                this.y < p.y + p.h && this.y + this.height > p.y) {
                if (this.vx > 0) { this.x = p.x - this.width; this.vx = 0; }
                if (this.vx < 0) { this.x = p.x + p.w; this.vx = 0; }
            }
        }
    }

    checkVerticalCollisions(platforms) {
        for (let p of platforms) {
            if (this.x < p.x + p.w && this.x + this.width > p.x &&
                this.y < p.y + p.h && this.y + this.height > p.y) {
                if (this.vy > 0) {
                    this.y = p.y - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                } else if (this.vy < 0) {
                    this.y = p.y + p.h;
                    this.vy = 0;
                }
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX + this.width / 2, this.y - cameraY + this.height);

        if (!this.facingRight) ctx.scale(-1, 1);

        let scaleX = 1;
        let scaleY = 1;

        if (!this.isGrounded) {
            scaleY = 1 + Math.min(0.3, Math.abs(this.vy) * 0.02);
            scaleX = 1 / scaleY;
        } else if (this.squash > 0) {
            scaleY = 1 - this.squash * 0.2;
            scaleX = 1 / scaleY;
        }

        ctx.scale(scaleX, scaleY);

        // Ground Shadow
        if (this.isGrounded) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        let legAngle = Math.sin(this.runCycle) * 0.5;

        // Suit Legs with joint animation
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 5;

        // Back Leg
        ctx.beginPath();
        ctx.moveTo(2, -18);
        ctx.lineTo(2 - Math.sin(legAngle) * 8, -6);
        ctx.lineTo(2 - Math.sin(legAngle) * 12, 0);
        ctx.stroke();

        // Front Leg
        ctx.beginPath();
        ctx.moveTo(-2, -18);
        ctx.lineTo(-2 + Math.sin(legAngle) * 8, -6);
        ctx.lineTo(-2 + Math.sin(legAngle) * 12, 0);
        ctx.stroke();

        // Suit Torso
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-9, -36, 18, 18);

        // White Shirt & Red Tie
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(-3, -36);
        ctx.lineTo(3, -36);
        ctx.lineTo(0, -26);
        ctx.fill();

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-1.5, -34, 3, 10);

        // Suit Jacket Lapels
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-9, -36, 4, 18);
        ctx.fillRect(5, -36, 4, 18);

        // Head
        ctx.fillStyle = '#fdba74';
        ctx.beginPath();
        ctx.arc(0, -42, 7.5, 0, Math.PI * 2);
        ctx.fill();

        // Sleek Sunglasses
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, -44, 7, 3.5);

        ctx.restore();
    }
}

class Coin {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.r = 9;
        this.collected = false;
        this.animTimer = Math.random() * 10;
    }

    update(player) {
        if (this.collected) return;
        let dx = (this.x) - (player.x + player.width / 2);
        let dy = (this.y) - (player.y + player.height / 2);
        if (Math.sqrt(dx * dx + dy * dy) < this.r + player.width / 2) {
            this.collected = true;
            score += 1;
            scoreEl.textContent = score;
            playCoinSound();
            spawnParticles(this.x, this.y, '#f1c40f', 8);
        }
    }

    draw() {
        if (this.collected) return;
        this.animTimer += 0.08;
        ctx.save();
        ctx.translate(this.x - cameraX, this.y - cameraY);

        // Subtle glowing aura
        let glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
        glow.addColorStop(0, 'rgba(241, 196, 15, 0.4)');
        glow.addColorStop(1, 'rgba(241, 196, 15, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(-14, -14, 28, 28);

        ctx.scale(Math.cos(this.animTimer), 1);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(-1, -1, this.r - 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Bug {
    constructor(x, y, platformWidth) {
        this.x = x;
        this.y = y - 12;
        this.w = 22;
        this.h = 12;
        this.minX = x;
        this.maxX = x + platformWidth - 22;
        this.speed = 1.1;
        this.squished = false;
        this.legsTimer = 0;
    }

    update(player) {
        if (this.squished) return;

        this.x += this.speed;
        if (this.x > this.maxX || this.x < this.minX) {
            this.speed *= -1;
        }

        // Squish Detection
        if (player.x < this.x + this.w && player.x + player.width > this.x &&
            player.y < this.y + this.h && player.y + player.height > this.y) {
            this.squished = true;
            score += 3;
            scoreEl.textContent = score;
            screenShake = 3;
            playSquishSound();
            spawnParticles(this.x + this.w / 2, this.y + this.h / 2, '#8b5cf6', 12, 1.2);
        }
    }

    draw() {
        if (this.squished) return;
        this.legsTimer += 0.25;
        ctx.save();
        ctx.translate(this.x - cameraX, this.y - cameraY);

        // Beetle Shell Gradient
        let gradient = ctx.createLinearGradient(0, 0, 0, this.h);
        gradient.addColorStop(0, '#6d28d9');
        gradient.addColorStop(1, '#4c1d95');
        ctx.fillStyle = gradient;

        ctx.beginPath();
        ctx.ellipse(this.w / 2, this.h / 2, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wiggling Spider Legs
        ctx.strokeStyle = '#2e1065';
        ctx.lineWidth = 1.8;
        let legOffset = Math.sin(this.legsTimer) * 2.5;

        ctx.beginPath();
        ctx.moveTo(3, this.h / 2); ctx.lineTo(-4, this.h + legOffset);
        ctx.moveTo(11, this.h / 2); ctx.lineTo(11, this.h + 3 - legOffset);
        ctx.moveTo(19, this.h / 2); ctx.lineTo(25, this.h + legOffset);
        ctx.stroke();

        ctx.restore();
    }
}

class TreasureChest {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = 34;
        this.h = 26;
        this.opened = false;
    }

    update(player) {
        if (this.opened) return;
        if (player.x < this.x + this.w && player.x + player.width > this.x &&
            player.y < this.y + this.h && player.y + player.height > this.y) {
            this.opened = true;
            score += 10;
            scoreEl.textContent = score;
            screenShake = 5;
            playChestSound();
            spawnParticles(this.x + this.w / 2, this.y + 10, '#fbbf24', 20, 1.5);
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y - cameraY);

        ctx.fillStyle = '#78350f';
        ctx.fillRect(0, 8, this.w, this.h - 8);

        ctx.fillStyle = '#d97706';
        ctx.fillRect(0, 8, 4, this.h - 8);
        ctx.fillRect(this.w - 4, 8, 4, this.h - 8);
        ctx.fillRect(0, this.h - 3, this.w, 3);

        if (this.opened) {
            ctx.fillStyle = '#92400e';
            ctx.fillRect(-2, -6, this.w + 4, 8);
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(4, 8, this.w - 8, 4);
        } else {
            ctx.fillStyle = '#92400e';
            ctx.fillRect(-2, 2, this.w + 4, 8);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(this.w / 2 - 3, 6, 6, 6);
        }
        ctx.restore();
    }
}

let player;
let platforms = [];
let coins = [];
let bugs = [];
let chests = [];

function generateProceduralMap(untilX) {
    while (lastGeneratedX < untilX) {
        let pitGap = 90 + Math.random() * 70;
        let platformWidth = 140 + Math.random() * 180;

        let heightChange = (Math.random() - 0.5) * 110;
        let newY = Math.max(220, Math.min(370, lastGeneratedY + heightChange));
        let newX = lastGeneratedX + pitGap;

        platforms.push({ x: newX, y: newY, w: platformWidth, h: 50 });

        if (Math.random() > 0.3) {
            coins.push(new Coin(newX + platformWidth / 2, newY - 28));
        }

        if (Math.random() > 0.35 && platformWidth > 150) {
            bugs.push(new Bug(newX + 25, newY, platformWidth));
        }

        if (Math.random() > 0.7) {
            chests.push(new TreasureChest(newX + platformWidth - 45, newY - 26));
        }

        lastGeneratedX = newX + platformWidth;
        lastGeneratedY = newY;
    }
}

function initGame() {
    score = 0;
    distance = 0;
    scoreEl.textContent = score;
    distEl.textContent = distance;
    cameraX = 0;
    cameraY = 0;
    particles = [];

    player = new Player(50, 240);
    platforms = [{ x: 0, y: 340, w: 420, h: 50 }];
    coins = [new Coin(220, 300)];
    bugs = [new Bug(160, 340, 200)];
    chests = [];

    lastGeneratedX = 420;
    lastGeneratedY = 340;
    generateProceduralMap(2000);
}

function triggerGameOver() {
    gameState = 'END';
    finalScoreEl.textContent = score;
    finalDistEl.textContent = distance;
    endScreen.classList.remove('hidden');
    playGameOverSound();
}

function update() {
    if (gameState !== 'PLAYING') return;

    player.update(platforms);

    distance = Math.floor(player.x / 10);
    distEl.textContent = distance;

    // Smooth Camera Follow
    let targetCamX = player.x - 220;
    let targetCamY = player.y - 260;
    cameraX += (targetCamX - cameraX) * 0.08;
    cameraY += (targetCamY - cameraY) * 0.05;
    if (cameraX < 0) cameraX = 0;

    // Screen shake decay
    if (screenShake > 0) screenShake *= 0.88;

    generateProceduralMap(cameraX + 1200);

    // Update Particles
    particles.forEach(p => p.update());
    particles = particles.filter(p => p.life > 0);

    // Clean up offscreen entities
    platforms = platforms.filter(p => p.x + p.w > cameraX - 250);
    coins = coins.filter(c => c.x > cameraX - 250);
    bugs = bugs.filter(b => b.x > cameraX - 250);
    chests = chests.filter(ch => ch.x > cameraX - 250);

    coins.forEach(coin => coin.update(player));
    bugs.forEach(bug => bug.update(player));
    chests.forEach(chest => chest.update(player));
}

function drawBackground() {
    // Dynamic Sky Gradient
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#090d16');
    skyGradient.addColorStop(1, '#1e293b');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Parallax Mountain Range (Distant)
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let i = 0; i <= canvas.width; i += 50) {
        let mountainY = 280 + Math.sin((i + cameraX * 0.1) * 0.01) * 35;
        ctx.lineTo(i, mountainY);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // Parallax Midground Hills
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let i = 0; i <= canvas.width; i += 30) {
        let hillY = 320 + Math.sin((i + cameraX * 0.3) * 0.015) * 20;
        ctx.lineTo(i, hillY);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();
}

function draw() {
    ctx.save();

    // Screen Shake Offset
    if (screenShake > 0.1) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }

    drawBackground();

    // Platforms with Top Highlights & Bevels
    for (let p of platforms) {
        // Platform Body Gradient
        let pGrad = ctx.createLinearGradient(0, p.y - cameraY, 0, p.y + p.h - cameraY);
        pGrad.addColorStop(0, '#334155');
        pGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = pGrad;
        ctx.fillRect(p.x - cameraX, p.y - cameraY, p.w, p.h);

        // Top Grass Rim
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x - cameraX, p.y - cameraY, p.w, 5);

        // Rim Glow
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(p.x - cameraX, p.y - cameraY, p.w, 1.5);
    }

    // Entities
    coins.forEach(coin => coin.draw());
    bugs.forEach(bug => bug.draw());
    chests.forEach(chest => chest.draw());
    particles.forEach(p => p.draw());

    // Player
    player.draw();

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

startBtn.addEventListener('click', () => {
    initAudio();
    initGame();
    gameState = 'PLAYING';
    startScreen.classList.add('hidden');
});

restartBtn.addEventListener('click', () => {
    initAudio();
    initGame();
    gameState = 'PLAYING';
    endScreen.classList.add('hidden');
});

requestAnimationFrame(gameLoop);
</script>
